<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline HTML Real-Time Editor</title>
    <style>
        /* CSS Styling */
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f1f1;
            overflow: hidden;
        }

        .header {
            height: 50px;
            background-color: #fff;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 18px;
            color: #333;
        }

        .container {
            display: flex;
            height: calc(100vh - 50px);
            width: 100%;
        }

        /* Editor Side */
        .editor-side {
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            border-right: 5px solid #ddd;
        }

        #code-editor {
            flex: 1;
            width: 100%;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            border: none;
            outline: none;
            background-color: #282c34;
            color: #abb2bf;
            resize: none;
            line-height: 1.5;
        }

        /* Preview Side */
        .preview-side {
            width: 50%;
            height: 100%;
            background-color: #fff;
        }

        #preview-window {
            width: 100%;
            height: 100%;
            border: none;
        }

        .label {
            background: #eee;
            padding: 5px 15px;
            font-size: 12px;
            text-transform: uppercase;
            color: #666;
            font-weight: bold;
        }

        /* Responsive for mobile */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .editor-side, .preview-side {
                width: 100%;
                height: 50%;
            }
            .editor-side {
                border-right: none;
                border-bottom: 5px solid #ddd;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Offline Code Editor</h1>
        <div>
            <small>Updates in real-time</small>
        </div>
    </div>

    <div class="container">
        <!-- Input Area -->
        <div class="editor-side">
            <div class="label">Source Code</div>
            <textarea id="code-editor" spellcheck="false" placeholder="Write your HTML here..."><!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; text-align: center; padding-top: 50px; }
  h1 { color: #4CAF50; }
  .card { 
    border: 1px solid #ccc; 
    padding: 20px; 
    display: inline-block; 
    border-radius: 8px; 
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Hello World!</h1>
    <p>Edit the code on the left to see changes here instantly.</p>
    <button onclick="alert('It works!')">Click Me</button>
  </div>

</body>
</html></textarea>
        </div>

        <!-- Output Area -->
        <div class="preview-side">
            <div class="label">Result</div>
            <iframe id="preview-window"></iframe>
        </div>
    </div>

    <script>
        const editor = document.getElementById('code-editor');
        const preview = document.getElementById('preview-window');

        // Function to update the iframe
        function updatePreview() {
            const code = editor.value;
            const previewDocument = preview.contentDocument || preview.contentWindow.document;
            
            previewDocument.open();
            previewDocument.write(code);
            previewDocument.close();
        }

        // Listen for typing events
        editor.addEventListener('input', updatePreview);

        // Allow "Tab" key to work inside the textarea
        editor.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;

                // Set textarea value to: text before caret + tab + text after caret
                this.value = this.value.substring(0, start) + "    " + this.value.substring(end);

                // Put caret in right position
                this.selectionStart = this.selectionEnd = start + 4;
            }
        });

        // Initialize preview on load
        window.onload = updatePreview;
    </script>
</body>
</html>
